<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin:0; padding:0; background:#f6f9fc;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="margin:24px 0; background:#ffffff; border-radius:8px; overflow:hidden;">
            <tr style="background:#0b61ff; color:#fff;">
              <td style="padding:18px; text-align:left;">
                {% if logo_url %}
                  <img src="{{ logo_url }}" alt="Eastside VB" style="height:36px; vertical-align:middle;" />
                {% else %}
                  <span style="font-weight:700; font-size:18px;">Eastside VB</span>
                {% endif %}
              </td>
            </tr>
            <tr>
              <td style="padding:24px; color:#1f2937;">
                <h2 style="margin-top:0;">Your access code(s)</h2>
                <p>Here are the access code(s) you requested for Eastside VB:</p>
                <ul>
                  {% for code in codes %}
                    <li style="font-size:16px; margin:6px 0;"><strong>{{ code }}</strong></li>
                  {% endfor %}
                </ul>
                <div style="text-align:center; margin:24px 0;">
                  <a href="{{ signup_url }}" style="background:#0b61ff; color:#fff; padding:12px 20px; border-radius:6px; text-decoration:none; display:inline-block;">Sign up now</a>
                </div>
                <p style="color:#6b7280; font-size:14px;">If you did not request these codes, ignore this email.</p>
                <p style="margin-top:16px; color:#6b7280; font-size:14px;">Thanks,<br/>Eastside VB team</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
